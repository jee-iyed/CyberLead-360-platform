# Override: run CyberLead 360 on PostgreSQL.
# Requires POSTGRES_PASSWORD in your shell or .env (never commit it).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cyberlead360
      POSTGRES_USER: cyberlead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberlead -d cyberlead360"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # no published port: only reachable from the app container network

  app:
    environment:
      DATABASE_URL: postgresql+psycopg://cyberlead:${POSTGRES_PASSWORD}@db:5432/cyberlead360
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg-data:
